# Neuro-Sovereign Enterprise v5 - Kubernetes manifest
# Apply with: kubectl apply -f k8s/nse-deployment.yaml
#
# SPATIAL ARCHITECTURE (Nexus / Park / Aorta):
#   - The layer/state dir /app/state is the PARK (shared, single source of truth
#     for all 9 SQLite molecules). It MUST persist across pod restarts.
#   - We therefore mount a PersistentVolumeClaim (RWX so both replicas share the
#     same Park). Do NOT use emptyDir: a node drain would wipe identity anchors,
#     DAO votes, compliance receipts and the legal multi-sig ledger.
#
#   - The static seed material (governance tokenomics, compliance framework,
#     routing policy, charter .sol, identity anchor docs) now lives under
#     assets/ in the repo and is baked into the image; at first boot it is
#     migrated ONCE into the Park. After seeding, only the Park (this PVC)
#     holds mutable state.
apiVersion: v1
kind: Namespace
metadata:
  name: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nse-config
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
data:
  NSE_ENVIRONMENT: production
  NSE_LOG_LEVEL: INFO
---
# PARK: shared persistent state for all molecules (single source of truth)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nse-state
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
spec:
  # Two replicas share the same Park -> needs a multi-attach capable class
  # (NFS / CephFS / GCE-SSD with allowVolumeExpansion, or your CSI RWX driver).
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # storageClassName: nse-rwx   # uncomment to pin an RWX storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nse
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
    app.kubernetes.io/version: "5.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neurosovereign
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neurosovereign
        app.kubernetes.io/version: "5.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nse
          image: nse:5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nse-config
          env:
            - name: NSE_DATA_DIR
              value: /app/state
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - neurosovereign.cli
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - neurosovereign.cli
                - status
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 15
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: nse-state
---
apiVersion: v1
kind: Service
metadata:
  name: nse
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neurosovereign
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
