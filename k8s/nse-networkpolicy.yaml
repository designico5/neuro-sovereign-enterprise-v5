# Neuro-Sovereign Enterprise v5 – Network Policy
# Restricts network access to NSE pods: only allow ingress from same namespace
# and egress to Redis (port 6379) and DNS (port 53).
#
# SPATIAL (Aorta): the broad public egress (0.0.0.0/0:443) that used to live
# here is REMOVED. External Aorta flow is now declared explicitly and
# domain-scoped in nse-aorta-egress.yaml (Calico FQDN whitelist). This default
# policy only allows the in-cluster essentials: DNS + Redis + health probes.
#
# Apply with: kubectl apply -f k8s/nse-networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nse-deny-all-default
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neurosovereign
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: neurosovereign
    # Allow health-check probes from the kube-system namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS resolution (needed to resolve the Aorta FQDN whitelist)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis (within same namespace or external)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: neurosovereign
      ports:
        - protocol: TCP
          port: 6379
    # NOTE: no 0.0.0.0/0 public egress. External Aorta egress is granted ONLY
    # by nse-aorta-egress.yaml (Calico FQDN whitelist). If that file is not
    # applied, external HTTPS is denied by default-deny.
