# Neuro-Sovereign Enterprise v5 - Kubernetes manifest
# Apply with: kubectl apply -f k8s/nse-deployment.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nse-config
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
data:
  NSE_ENVIRONMENT: production
  NSE_LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nse
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
    app.kubernetes.io/version: "5.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neurosovereign
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neurosovereign
        app.kubernetes.io/version: "5.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nse
          image: nse:5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nse-config
          env:
            - name: NSE_DATA_DIR
              value: /app/state
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - neurosovereign.cli
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - neurosovereign.cli
                - status
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 15
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nse
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neurosovereign
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
