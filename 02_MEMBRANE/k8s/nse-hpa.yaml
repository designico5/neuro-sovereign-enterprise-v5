# Neuro-Sovereign Enterprise v5 – Horizontal Pod Autoscaler
# Scales NSE pods based on CPU and memory utilization.
# Apply with: kubectl apply -f k8s/nse-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nse
  namespace: neurosovereign
  labels:
    app.kubernetes.io/name: neurosovereign
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nse
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
