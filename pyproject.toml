[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-sovereign-enterprise"
version = "5.0.0"
description = "Neuro-Symbolic Sovereign Enterprise Platform v5.0-SYMBIOSIS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NeuroSovereign Team" }]
keywords = ["sovereign-ai", "neuro-symbolic", "17-layer", "ed25519", "governance", "ethos-identity"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "cryptography>=42.0.8",
    "pynacl>=1.5.0",
    "ecdsa>=0.19.0",
    "web3>=6.19.0",
    "eth-account>=0.11.0",
    "requests>=2.32.3",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "websockets>=13.0",
    "PyJWT>=2.9.0",
    "SQLAlchemy>=2.0.32",
    "alembic>=1.13.2",
    "sqlitedict>=2.1.0",
    "numpy>=1.26.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "colorlog>=6.8.0",
    "python-dotenv>=1.0.1",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "platformdirs>=4.3.6",
    "msal>=1.31.0",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "watchdog>=4.0.2",
    "schedule>=1.2.2",
    "APScheduler>=3.10.4",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "duckduckgo-search>=6.3.0",
    "bs4>=0.0.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "Pillow>=10.4.0",
    "reportlab>=4.2.5",
    "hashids>=1.3.1",
    "shortuuid>=1.0.13",
    "validators>=0.34.0",
    "deepdiff>=7.0.1",
    "jsonschema>=4.23.0",
    "orjson>=3.10.10",
    "cbor2>=5.6.5",
    "zstandard>=0.23.0",
    "pycryptodome>=3.21.0",
    "RestrictedPython>=7.3",
    "docker>=7.1.0",
    "paramiko>=3.5.0",
    "jinja2>=3.1.4",
    "pygit2>=1.16.0",
    "packaging>=24.1",
    "humanize>=4.10.0"
]

[project.optional-dependencies]
ai = [
    "ollama>=0.3.3",
    "openai>=1.42.0",
    "torch>=2.4.0",
    "whisper>=1.1.10",
    "pyttsx3>=2.98",
    "transformers>=4.45.0",
    "sentence-transformers>=3.1.0",
    "chromadb>=0.5.5",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.1.3",
    "neo4j>=5.23.1"
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "bandit>=1.7.10",
    "slither-analyzer>=0.58.0",
    "pre-commit>=4.0.1",
    "pip-audit>=2.7.1",
    "cyclonedx-py>=10.2.0",
    "tox>=4.23.0",
    "commitizen>=3.30.0"
]
voice = [
    "soundfile>=0.12.1",
    "sounddevice>=0.5.1",
    "pyaudio>=0.2.14",
    "opuslib>=3.0.1",
    "SpeechRecognition>=3.11.0",
    "gTTS>=2.5.3"
]

[project.scripts]
nse = "neurosovereign.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurosovereign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-v --cov=. --cov-report=term-missing --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "BLE", "SIM", "TCH", "FLY"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
